[package]
name = "rust_server"
version = "0.1.0"
edition = '2024'

[dependencies]
actix-cors = "0.7.1"
actix-web = "4"
chrono = { version = "0.4.44", features = ["serde"] }
env_logger = "0.11.10"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
validator = { version = "0.20.0", features = ["derive"] }

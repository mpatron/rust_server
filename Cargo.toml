[package]
name = "rust_server"
version = "0.1.0"
edition = '2024'

[dependencies]
actix-cors = "0.7.1"
actix-web = "4"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
validator = { version = "0.20.0", features = ["derive"] }

[package]
name = "rust_server"
version = "0.1.0"
edition = '2024'

[dependencies]
actix-cors = "0"
actix-web = "4"
chrono = { version = "0", features = ["serde"] }
env_logger = "0"
log = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["actix_extras"] }
uuid = { version = "1", features = ["serde", "v7"] }
validator = { version = "0", features = ["derive"] }
